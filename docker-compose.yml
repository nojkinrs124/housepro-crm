version: '3.8'

services:
  # ============================================================
  # PostgreSQL Database (Supabase uses this)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: housepro-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - housepro-network

  # ============================================================
  # Supabase Auth (JWT token generation)
  # ============================================================
  kong:
    image: kong:3.0-alpine
    container_name: housepro-kong
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: postgres
      KONG_PG_PASSWORD: postgres
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    volumes:
      - ./docker/kong.yml:/etc/kong/kong.yml
    command: kong start
    networks:
      - housepro-network

  # ============================================================
  # Supabase Studio (Web Interface)
  # ============================================================
  studio:
    image: supabase/studio:latest
    container_name: housepro-studio
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION_NAME: HousePro
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: .YOUR_ANON_KEY_PLACEHOLDER.PLACEHOLDER
      SUPABASE_SERVICE_ROLE_KEY: .YOUR_SERVICE_ROLE_KEY_PLACEHOLDER.PLACEHOLDER
    ports:
      - "3000:3000"
    networks:
      - housepro-network

  # ============================================================
  # Redis (Optional - for caching)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: housepro-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - housepro-network

  # ============================================================
  # Mailpit (Email testing)
  # ============================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: housepro-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - housepro-network

networks:
  housepro-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

# ============================================================
# USAGE:
# ============================================================
# Start services:
#   docker-compose up -d
#
# Stop services:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f
#
# Access:
#   - Supabase Studio: http://localhost:3000
#   - API: http://localhost:8000
#   - Mailpit: http://localhost:8025
#   - PostgreSQL: localhost:5432
#   - Redis: localhost:6379
#
# ============================================================
